# ===============================
# Application Configuration
# ===============================
spring.application.name=zplusbank
# ===============================
# Server Configuration
# ===============================
server.port=8989
# ===============================
# Datasource Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/zplusbankdev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.open-in-view=false
# ===============================
# Mail Configuration (Gmail SMTP)
# ===============================
# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=khannjuned3@gmail.com
spring.mail.password=your-app-specific-password-here
spring.mail.protocol=smtp
# Mail Properties for Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Timeout Settings
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.writetimeout=10000
# SSL/TLS Security
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.socketFactory.port=587
# Connection Pooling (for better performance)
spring.mail.properties.mail.smtp.connectionpool=true
spring.mail.properties.mail.smtp.connectionpooltimeout=5000
spring.mail.properties.mail.smtp.connectionpoolmaxsize=5
spring.mail.properties.mail.smtp.maxconnects=3
# Additional Properties
spring.mail.properties.mail.smtp.sendpartial=true
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.reportsuccess=false
# Default Sender Configuration
spring.mail.default-encoding=UTF-8
spring.mail.from=khannjuned3@gmail.com
spring.mail.test-connection=false
# ===============================
# Thymeleaf Configuration for Email Templates
# ===============================
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
# ===============================
# Application Custom Properties
# ===============================
# JWT Configuration
app.jwt.secret=bankManagementSecretKey2024SecureKeyForHS512AlgorithmWithEnoughLength
#bankManagementSecretKey2024
app.jwt.expiration-ms=86400000
# Transaction Configuration
app.transaction.max-withdrawal-limit=50000
app.transaction.min-balance=1000
app.transaction.daily-transfer-limit=100000
app.transaction.max-beneficiaries=20
# OTP Configuration
app.otp.expiration-minutes=5
app.otp.length=6
app.otp.max-attempts-per-hour=5
app.otp.max-attempts-per-day=20
app.otp.resend-delay-seconds=60
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
# Email Configuration
app.email.async-enabled=true
app.email.retry.max-attempts=3
app.email.retry.initial-delay=1000
app.email.retry.multiplier=2
app.email.rate-limit.per-hour=100
app.email.rate-limit.per-day=1000
# Bank Information for Emails
app.bank.name=ZPlus Bank
app.bank.support.email=support@zplusbank.com
app.bank.support.phone=1800-123-4567
app.bank.website=https://www.zplusbank.com
app.bank.address=123 Main Street, Financial District, Mumbai - 400001
# Security Configuration
app.security.login.max-attempts=5
app.security.login.lockout-minutes=30
app.security.session.timeout-minutes=30
app.security.password.expiry-days=90
app.security.password.min-length=8
app.security.password.require-special-char=true
app.security.password.require-number=true
app.security.password.require-uppercase=true
# Loan Configuration
app.loan.interest-rate.personal=10.5
app.loan.interest-rate.home=8.25
app.loan.interest-rate.car=9.0
app.loan.interest-rate.education=7.5
app.loan.max-tenure.months=360
app.loan.min-amount=10000
app.loan.max-amount=50000000
# Account Configuration
app.account.min-opening-balance=1000
app.account.min-balance.savings=1000
app.account.min-balance.current=5000
app.account.interest-rate.savings=3.5
app.account.interest-rate.current=0
app.account.interest-calculation-frequency=QUARTERLY
# File Upload Configuration
app.file.max-size=10485760  # 10MB
app.file.allowed-extensions=jpg,jpeg,png,pdf,doc,docx
app.file.upload-dir=./uploads
# Report Configuration
app.report.transaction.max-days=90
app.report.statement.max-months=12
app.report.generate-timeout-seconds=300
# ===============================
# Logging Configuration
# ===============================
# Root logging
logging.level.root=INFO
# Application specific logging
logging.level.com.bank=DEBUG
logging.level.com.zplusbank=DEBUG
# Framework logging
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.mail=DEBUG
# Database logging
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.stat=DEBUG
# Email logging
logging.level.com.sun.mail=WARN
logging.level.javax.mail=WARN
# Other libraries
logging.level.org.apache.kafka=WARN
logging.level.org.apache.tomcat=INFO
# File logging configuration
logging.file.name=logs/zplusbankdev.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# Custom log patterns for different levels
logging.pattern.level=%5p
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
# Enable colored output for console
spring.output.ansi.enabled=ALWAYS